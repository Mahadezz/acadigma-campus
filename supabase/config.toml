# Supabase CLI configuration for project `Acadigma Campus` (DECISION-LOG D-53, superseding D-19).
#
# There is no Docker on the development machine, so the local stack is never
# started: migrations are authored here and applied to the cloud project by CI on
# merge to main (ARCHITECTURE §4, §8). The [db] and [auth] blocks below still matter
# because `supabase db diff`, `supabase db push` and the pgTAP runner read them.

project_id = "kekfmibwjejdhxjkmezo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
# `app` holds the SECURITY DEFINER helpers that RLS policies call. It is deliberately
# not exposed through PostgREST — those functions are for policies, not for clients.
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Matches the cloud project (ARCHITECTURE §1).
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

# The default path (./seed.sql) does not exist — seed.sql lives in its own
# ./seed/ directory alongside demo-class-6-ka.sql, a manual runbook script (needs
# a real school's workspace id/name set first) that must NOT be auto-applied.
# Without this block `supabase start`/`db reset` silently seeded nothing at all
# (confirmed on PR #77's own CI run: "WARN: no files matched pattern:
# supabase/seed.sql"), contradicting seed.sql's own header comment.
#
# e2e-fixtures.sql (D-76 / OQ-27) runs after seed.sql on purpose — it reads
# the owner/teacher ids and workspace seed.sql just created — and sources
# demo-class-6-ka.sql itself (unmodified) via \ir, so that file stays out of
# this list.
[db.seed]
enabled = true
sql_paths = ["./seed/seed.sql", "./seed/e2e-fixtures.sql"]

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# Bengali-font PDFs and scanned admission documents are the large end of this.
file_size_limit = "50MiB"

[storage.buckets.private]
public = false
file_size_limit = "50MiB"

[storage.buckets.public]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/svg+xml"]

[auth]
enabled = true
site_url = "env(APP_URL)"
additional_redirect_urls = ["env(APP_URL)"]
# One hour of access token, so a revoked membership stops mattering quickly.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Invitations are how members join a workspace; open sign-up is allowed because the
# marketplace and hiring areas are user-level (D-10).
enable_signup = true
# Anonymous sign-ins would carry the `authenticated` Postgres role and slip past any
# policy that only checks the role rather than membership. Off.
enable_anonymous_sign_ins = false
# SECURITY.md §5.7.5 [MUST]: minimum 12. Mirrored by PASSWORD_MIN_LENGTH in
# packages/domain/src/auth/passwordPolicy.ts -- GoTrue enforces it even for any
# path that does not go through our own server action.
password_min_length = 12
# The other half of §5.7.5 -- HaveIBeenPwned leaked-password rejection -- has no
# config.toml key; it is a dashboard/Management-API setting on the hosted project
# and is NOT on yet. Tracked as OQ-19 in F-ID-01 §11.

[auth.email]
enable_signup = true
# A verified address is the recovery path for every account in the system.
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirm your Acadigma Campus account"

[auth.sessions]
# Sign out sessions untouched for 30 days; re-authenticate weekly at the latest.
timebox = "720h"
inactivity_timeout = "168h"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
# Blunts credential stuffing without locking out a school sharing one IP.
sign_in_sign_ups = 30
token_refresh = 150
email_sent = 10
otp = 30

[edge_runtime]
enabled = true
policy = "oneshot"

# Payment callback. SSLCommerz posts to it directly, so it cannot require a session.
# Verification is by store credentials against the gateway's validation API, never by
# trusting the POST body (ARCHITECTURE §5, DECISION-LOG D-09).
[functions.sslcommerz-ipn]
enabled = true
verify_jwt = false

[analytics]
enabled = false
