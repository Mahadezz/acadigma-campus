# gitleaks configuration. The default rule set is the baseline and nothing here
# weakens it. False positives are allowlisted individually, with a reason — a rule is
# never disabled wholesale (CI.md §2.7).

[extend]
useDefault = true

[allowlist]
description = "Known-public values and generated files"

paths = [
  '''pnpm-lock\.yaml''',
  '''packages/db/src/types\.generated\.ts''',
]

regexes = [
  # The Supabase publishable key is browser-safe by design and appears in
  # .env.example, the CI workflow and DECISION-LOG D-19 on purpose.
  '''sb_publishable_6POCbYjBAcrSiT1AlCPSVQ_SG3ohfsL''',
  '''sb_publishable_VbUqiEvQiuObUZMf5IGYOA_P_EiiyGy''',
  # F-ID-05 Part 4 tests: a fixed UUID used as a wizard idempotency_key
  # (a request dedupe id, not a credential) — the key name trips
  # generic-api-key.
  '''0b6f4a8e-3c1d-4e2a-9f7b-5d8c6e4a2b10''',
]
