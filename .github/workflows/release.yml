name: Release

# Changesets keeps a rolling "chore(release): version packages" PR open on main.
# Merging it bumps versions, writes the CHANGELOGs, tags and creates the GitHub
# Release (RELEASES §3, §5). Every package is private, so nothing is published to a
# registry — the tag and the release are the artefact (RELEASES §1).

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled release run is a half-applied release.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Changesets compares against history to work out what changed.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Never tag something that does not build.
      - name: Build
        run: pnpm build

      - name: Open the version PR, or tag the release when one is merged
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        # changesets/action v2 renamed its inputs and no longer reads the token
        # from env (v2.0.0 CHANGELOG); the old names would silently break the
        # next release run, which PR CI never exercises.
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### release"
            echo
            if [ "${{ steps.changesets.outputs.published }}" = "true" ]; then
              echo "Tagged and released."
            elif [ "${{ steps.changesets.outputs.hasChangesets }}" = "true" ]; then
              echo "Version PR opened or updated. Merging it is the act of releasing."
            else
              echo "No changesets pending; nothing to release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
