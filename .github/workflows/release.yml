name: Release

# Changesets keeps a rolling "chore(release): version packages" PR open on main.
# Merging it bumps versions, writes the CHANGELOGs, tags and creates the GitHub
# Release (RELEASES §3, §5). Every package is private, so nothing is published to a
# registry — the tag and the release are the artefact (RELEASES §1).

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled release run is a half-applied release.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # Changesets compares against history to work out what changed.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Never tag something that does not build.
      - name: Build
        run: pnpm build

      - name: Open the version PR, or tag the release when one is merged
        id: changesets
        uses: changesets/action@e0145edc7d9d8679003495b11f87bd8ef63c0cba # v1.5.3
        with:
          version: pnpm changeset version
          publish: pnpm release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### release"
            echo
            if [ "${{ steps.changesets.outputs.published }}" = "true" ]; then
              echo "Tagged and released."
            elif [ "${{ steps.changesets.outputs.hasChangesets }}" = "true" ]; then
              echo "Version PR opened or updated. Merging it is the act of releasing."
            else
              echo "No changesets pending; nothing to release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
