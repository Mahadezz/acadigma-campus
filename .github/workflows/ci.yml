name: CI

# Implements docs/engineering/CI.md. Job ids are contract: branch protection matches
# on "CI / <job id>", so renaming one silently disables its gate (CI.md §3).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded PR run is wasted money; a cancelled main run is a half-applied release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Public by design (D-53, superseding D-19). Present so `next build` needs no repository secret.
  NEXT_PUBLIC_SUPABASE_URL: https://kekfmibwjejdhxjkmezo.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_VbUqiEvQiuObUZMf5IGYOA_P_EiiyGy
  APP_URL: http://127.0.0.1:3000
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # D-21. Branch protection is the first line; this leaves a red mark if it is ever
  # loosened. Squash-merges are ordinary commits, so ask GitHub which PR produced
  # this one rather than looking for a merge commit.
  guard:
    name: guard
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require the commit to come from a merged pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          merged=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null)] | length')
          if [ "$merged" -eq 0 ]; then
            echo "::error::${{ github.sha }} reached main without a merged pull request (D-21)."
            echo "### guard — FAILED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### guard — commit arrived via a merged pull request" >> "$GITHUB_STEP_SUMMARY"

  # D-70: computed once, gates the expensive jobs so a docs-only PR pays for none of
  # them. A skipped job reports as passing, so required checks stay green. `push` to
  # main and `merge_group` are always a full run.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      db: ${{ steps.diff.outputs.db }}
      app: ${{ steps.diff.outputs.app }}
      dbIntegration: ${{ steps.diff.outputs.dbIntegration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # base_ref goes through env, not string interpolation (same convention as the
      # db job's "Migrations are append-only" step). No third-party action.
      #
      # Fail closed: app defaults true and is skipped ONLY when every changed file is
      # provably docs/prose/dotfile config that cannot affect app or db code (a narrow
      # allowlist) — an empty diff, a renamed file (--no-renames keeps both the old and
      # new path as separate lines), or anything this allowlist doesn't recognise all
      # leave app=true. db is the narrow, opposite case (true only when supabase/** or
      # .github/** — workflows, actions, dependabot, everything — changed) since it is
      # the expensive job and has no correctness cost when skipped for a docs/app-only
      # PR; the append-only and order checks it runs only matter when db=true anyway.
      # dbIntegration (D-73) is the same narrow shape as db, plus packages/db/** and
      # packages/contracts/** (the code the real-PostgREST job actually exercises) —
      # .github/** is included too, so a CI workflow change (like this one) tests
      # itself instead of skipping the very job it just added.
      - name: Diff against the base
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "db=true" >> "$GITHUB_OUTPUT"
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "dbIntegration=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --no-renames --name-only "origin/$BASE_REF...HEAD")

          app=true
          if [ -n "$files" ] && ! grep -qvE '^(docs/|[^/]+\.md$|\.editorconfig$|\.gitattributes$|\.gitignore$)' <<<"$files"; then
            app=false
          fi

          db=false
          if grep -qE '^(supabase/|\.github/)' <<<"$files"; then
            db=true
          fi

          dbIntegration=false
          if grep -qE '^(supabase/|packages/db/|packages/contracts/|\.github/)' <<<"$files"; then
            dbIntegration=true
          fi

          echo "db=$db" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "dbIntegration=$dbIntegration" >> "$GITHUB_OUTPUT"

      # D-73: #57 and #70 both put unformatted .md on main because a docs-only PR
      # (app=false) skips the whole `lint` job, prettier included. Rather than pay
      # for a full pnpm install on every PR just to recheck .md files `lint` already
      # covers, this only runs for the docs-only case `lint` actually skips.
      - uses: ./.github/actions/setup
        if: steps.diff.outputs.app == 'false'

      - name: Prettier check on changed markdown (docs-only PRs skip the lint job)
        if: steps.diff.outputs.app == 'false'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --no-renames --name-only --diff-filter=d "origin/$BASE_REF...HEAD" -- '*.md')
          if [ ${#files[@]} -eq 0 ]; then
            echo "### changes — no markdown changed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pnpm exec prettier --check --cache "${files[@]}"
          echo "### changes — prettier --check passed on ${#files[@]} changed markdown file(s)" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          docsOnly=false
          [ "${{ steps.diff.outputs.db }}" = "false" ] && [ "${{ steps.diff.outputs.app }}" = "false" ] && docsOnly=true
          echo "### changes — db=${{ steps.diff.outputs.db }} app=${{ steps.diff.outputs.app }} dbIntegration=${{ steps.diff.outputs.dbIntegration }} docs-only=$docsOnly" >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: lint
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.outputs.app != 'false' || needs.changes.outputs.db != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # Warnings are errors: a warning nobody fixes hides the next real one.
      - name: ESLint
        run: pnpm lint --max-warnings=0

      - name: Prettier
        run: pnpm format:check

      # A new variable that only exists in someone's .env.local breaks every other
      # checkout silently. This is the check that stops it.
      - name: .env.example parity
        run: node scripts/check-env-parity.mjs

      - name: Summary
        if: always()
        run: echo "### lint" >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: typecheck
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.outputs.app != 'false' || needs.changes.outputs.db != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # Runs against the committed types.generated.ts; freshness is `contracts`' job,
      # so a stale-types failure reports as the right thing.
      - name: tsc --noEmit
        run: pnpm typecheck

      - name: Summary
        if: always()
        run: echo "### typecheck" >> "$GITHUB_STEP_SUMMARY"

  # The authorization gate. D-20: pgTAP runs against a Postgres 17 service container
  # rather than the shared Supabase dev branch, so a PR's RLS tests never depend on
  # whichever branch pushed last.
  db:
    name: db
    needs: changes
    if: "!cancelled() && needs.changes.outputs.db != 'false'"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acadigma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: acadigma_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Forward-only is checked mechanically, not trusted (CI.md §2.3 step 2).
      # base_ref goes through env, not string interpolation, so it can't be
      # used to inject shell code into this step.
      - name: Migrations are append-only
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-migrations-append-only.mjs "origin/$BASE_REF"

      # LANES.md "Migration order at merge time": lanes merge in whatever order they
      # finish, so a PR's migration can sort before one another lane merged first.
      # `supabase db push` refuses that; catch it here instead of on the production
      # deploy.
      - name: Migrations sort after main's newest
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-migrations-order.mjs "origin/$BASE_REF"

      # pgTAP is a server-side extension, so it is installed inside the service
      # container. The official postgres image already has the PGDG apt repository.
      - name: Install pgTAP into the Postgres container
        run: |
          set -euo pipefail
          docker exec ${{ job.services.postgres.id }} bash -c \
            "apt-get update -qq && apt-get install -y --no-install-recommends postgresql-17-pgtap"

      - name: Install psql and pg_prove
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            postgresql-client libtap-parser-sourcehandler-pgtap-perl

      - name: Create the Supabase-shaped roles and schemas
        run: psql -v ON_ERROR_STOP=1 --quiet --file supabase/ci/bootstrap.sql

      - name: Apply migrations in order
        run: |
          set -euo pipefail
          for file in $(find supabase/migrations -name '*.sql' | sort); do
            echo "--- $file"
            psql -v ON_ERROR_STOP=1 --quiet --file "$file"
          done

      # D-55: generated types must describe THIS PR's schema, so they are
      # generated from the CI Postgres after the PR's migrations ran, never from
      # the live project (which only gets a PR's migrations after merge). On a
      # mismatch the fresh file is uploaded as the `types-generated` artifact:
      #   gh run download <run-id> -n types-generated -D packages/db/src
      - uses: ./.github/actions/setup

      - name: Generated types match this PR's migrations
        run: |
          set -euo pipefail
          pnpm exec supabase gen types typescript             --db-url "postgresql://postgres:postgres@127.0.0.1:5432/acadigma_test"             --schema public > /tmp/types.generated.ts
          pnpm exec prettier --stdin-filepath packages/db/src/types.generated.ts             < /tmp/types.generated.ts > /tmp/types.formatted.ts
          mkdir -p types-out && cp /tmp/types.formatted.ts types-out/types.generated.ts
          if ! diff -u packages/db/src/types.generated.ts /tmp/types.formatted.ts; then
            echo "::error::packages/db/src/types.generated.ts does not match this PR's migrations. Download the types-generated artifact from this run into packages/db/src and commit it."
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: types-generated
          path: types-out/types.generated.ts
          retention-days: 14
          if-no-files-found: ignore

      # D-56: fails when a workspace_id table has RLS off, checked against
      # the live catalog after this PR's migrations applied. The other half
      # of this gate — every workspace_id table named in a
      # supabase/tests/*.sql file — is `contracts`'s "workspace_id table
      # coverage" step below: pure static analysis on the checkout, so it
      # needs no database at all (see coverage.sql's own header comment for
      # why the split is a job-boundary choice, not a hard requirement).
      - name: RLS coverage
        run: |
          set -euo pipefail
          if [ -f supabase/tests/coverage.sql ]; then
            psql -v ON_ERROR_STOP=1 --file supabase/tests/coverage.sql
          else
            echo "::warning::supabase/tests/coverage.sql is missing — RLS coverage was not verified."
          fi

      # coverage.sql is plain SQL (a DO/RAISE EXCEPTION block, run separately
      # above), not a pgTAP file — it has no `select plan(N)`, so pg_prove
      # fails it with "No plan found in TAP output" if the glob includes it.
      - name: pgTAP
        run: |
          set -euo pipefail
          pg_prove --verbose --ext .sql $(ls supabase/tests/*.sql | grep -v '/coverage\.sql$') | tee pgtap.tap

      - name: Summary
        if: always()
        run: |
          {
            echo "### db — pgTAP"
            echo
            echo '```'
            tail -30 pgtap.tap 2>/dev/null || echo "no TAP output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pgtap
          path: pgtap.tap
          retention-days: 14

  # D-73: the gap #61 (PGRST201 on /app/classes) fell through. `unit`'s vitest suite
  # mocks the Supabase client, so it never resolves a real PostgREST relationship;
  # `db` above runs pgTAP against bare postgres:17 with no PostgREST in front of it
  # at all; the one e2e journey that opens /app/classes as a real owner is
  # skip-gated on E2E_LIVE_SUPABASE + OQ-27, which CI never sets. This job starts a
  # real local Supabase stack (matching db.yml's CLI version) and runs every opt-in
  # *.integration.test.ts against it — #61's own DB_LOCAL_SUPABASE=1 test
  # (packages/db/src/repositories/academics.integration.test.ts) is the seed for
  # this job, now wired to run by default in CI instead of opt-in only.
  db-integration:
    name: db-integration
    needs: changes
    if: "!cancelled() && needs.changes.outputs.dbIntegration != 'false'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      # A GitHub-hosted runner always starts from a fresh Postgres data volume, so
      # `start` also applies every supabase/migrations/*.sql and supabase/seed/*.sql
      # before it brings PostgREST/GoTrue up in front of them — the same CLI db.yml's
      # `push` job uses, pointed at a disposable local stack instead of production.
      - name: supabase start
        run: supabase start

      # Not secrets: fixed, well-known local-CLI demo keys for an ephemeral,
      # network-isolated stack this job tears down with the runner.
      - name: Export the local anon/service keys
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          {
            echo "DB_LOCAL_SUPABASE=1"
            echo "DB_LOCAL_SUPABASE_URL=$API_URL"
            echo "DB_LOCAL_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "DB_LOCAL_SUPABASE_SERVICE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      # Every *.integration.test.ts in the workspace, wherever a lane adds the next
      # one — not just packages/db's. Each already carries its own
      # `describe.skipIf(!RUN)` guard; DB_LOCAL_SUPABASE=1 above turns RUN on, so
      # nothing here needs to know which suites exist. Passed as explicit file
      # arguments to the root vitest config (vitest.config.ts's `projects`, not one
      # config per package) rather than `cd`-ing into each package and running its
      # `test` script — the latter would still load the root config from cwd and run
      # every project's whole suite, not just the file that changed.
      - name: Run every *.integration.test.ts against real PostgREST
        run: |
          set -euo pipefail
          mapfile -t files < <(find packages apps -name '*.integration.test.ts' -not -path '*/node_modules/*' | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "### db-integration — no *.integration.test.ts files in the tree" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### db-integration — ${#files[@]} file(s): ${files[*]}" >> "$GITHUB_STEP_SUMMARY"
          pnpm exec vitest run "${files[@]}"

  # D-76 (OQ-27): closes the gap D-73 item 5 left open. The `e2e` job below
  # builds against the production NEXT_PUBLIC_SUPABASE_* values (this
  # workflow's top-level env) and every seeded-account journey skips itself
  # (`E2E_LIVE_SUPABASE` unset) — 106 of ~126 Playwright tests never actually
  # run in CI. This job starts the same local Supabase stack db-integration
  # uses, builds a SECOND, separate `next build` pointed at that stack's own
  # URL/keys (Next.js inlines NEXT_PUBLIC_* at build time — the artifact the
  # `build` job already produced cannot be reused here), seeds the accounts
  # every journey's own comments say they need, and runs the full suite,
  # every viewport, un-skipped.
  e2e-live:
    name: e2e-live
    needs: changes
    # Same rules as e2e/lighthouse (see e2e's comment): not on push to main
    # (already covered by the PR that merged), draft PRs skip it, only when
    # app or db code changed.
    if: |
      !cancelled() &&
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (needs.changes.outputs.app != 'false' || needs.changes.outputs.db != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # D-76 follow-up: nearly every journey signs in as the ONE seeded
    # owner@acadigma.test and reads/writes the ONE seeded Class 6 -- ক
    # section (today's attendance, ui_mode/text_size preferences, exam and
    # marks state, ...). Two tests running concurrently against that same
    # account/section produce exactly the kind of failure a real bug does
    # (a dashboard assertion of "no attendance yet" loses a race against
    # another test that just marked it) -- confirmed for real on this PR's
    # own local runs, and flagged again by the design lane (#82: basic-
    # class-hub.spec.ts marks attendance on the same shared section). A
    # single worker removes every intra-run race, at the cost of no
    # in-run parallelism; sharding gets the wall time back by running 4
    # such single-worker instances at once, each against its OWN fresh,
    # isolated local Supabase stack (a matrix job is a separate runner —
    # no state is shared between shards, only within one).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NODE_ENV: production
      PLAYWRIGHT_PORT: "3110"
      APP_URL: http://127.0.0.1:3110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      # Same CLI version and pattern as db-integration: a GitHub-hosted
      # runner always starts from a fresh Postgres data volume, so `start`
      # applies every supabase/migrations/*.sql and BOTH supabase/seed/*.sql
      # files (config.toml [db.seed] sql_paths: seed.sql then
      # e2e-fixtures.sql) before PostgREST/GoTrue come up in front of them.
      - name: supabase start
        run: supabase start

      # Not secrets: fixed, well-known local-CLI demo keys for an ephemeral,
      # network-isolated stack this job tears down with the runner (same
      # note as db-integration's equivalent step). Overrides this workflow's
      # top-level NEXT_PUBLIC_SUPABASE_* (the production project) for every
      # later step in this job only — the whole reason this is a separate
      # job from `build`/`e2e`, which must keep shipping the real values.
      - name: Export the local stack's URL/keys and the seeded E2E accounts
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_MAILPIT_URL=$MAILPIT_URL"
            echo "E2E_LIVE_SUPABASE=1"
            # supabase/seed/seed.sql — the Model School's owner/teacher.
            echo "E2E_OWNER_EMAIL=owner@acadigma.test"
            echo "E2E_OWNER_PASSWORD=password123"
            echo "E2E_TEACHER_EMAIL=teacher@acadigma.test"
            echo "E2E_TEACHER_PASSWORD=password123"
            # supabase/seed/e2e-fixtures.sql — membership-less accounts and
            # a parent not already a member of the school (D-76).
            echo "E2E_TEST_USER_EMAIL=e2e-test-user@acadigma.test"
            echo "E2E_TEST_USER_PASSWORD=password123"
            echo "E2E_TEST_USER_EMAIL_2=e2e-test-user-2@acadigma.test"
            echo "E2E_TEST_USER_PASSWORD_2=password123"
            echo "E2E_ONBOARDING_TEST_EMAIL=e2e-onboarding-user@acadigma.test"
            echo "E2E_ONBOARDING_TEST_PASSWORD=password123"
            echo "E2E_PARENT_EMAIL=e2e-parent@acadigma.test"
            echo "E2E_PARENT_PASSWORD=password123"
          } >> "$GITHUB_ENV"

      # A second, separate build from the `build` job's artifact (see the
      # job comment above) — Next.js inlines NEXT_PUBLIC_* at build time.
      - name: Build against the local stack
        run: pnpm --filter @acadigma/web build

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm --filter @acadigma/web exec playwright install --with-deps chromium

      # playwright.config.ts starts `next start --port 3110` (PLAYWRIGHT_PORT
      # above) and waits for it; both the phone and desktop projects run,
      # every journey un-skipped by the env this job just set. --workers=1
      # (overrides the config's CI default of 2) and --shard split this
      # shard's quarter of the suite into one strictly sequential run.
      # `pnpm --filter ... exec playwright` (not the nested `test:e2e`
      # script two package.json files deep) so these flags reach the
      # playwright binary directly, with no script-arg-forwarding ambiguity.
      - name: Playwright (live Supabase, every journey, shard ${{ matrix.shard }}/4, single worker)
        run: pnpm --filter @acadigma/web exec playwright test --workers=1 --shard=${{ matrix.shard }}/4

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-live-${{ matrix.shard }}
          path: apps/web/playwright-report/
          retention-days: 30

      - name: Summary
        if: always()
        run: node scripts/e2e-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  unit:
    name: unit
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.outputs.app != 'false' || needs.changes.outputs.db != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # Zero retries: a unit test that needs one is a bug report (CI.md §2.4).
      - name: Vitest with coverage
        run: pnpm test:cov

      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unit-results
          path: |
            coverage/
            test-results/
          retention-days: 14

  # Cheap drift detection, separated so the failure message is unambiguous.
  contracts:
    name: contracts
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.outputs.app != 'false' || needs.changes.outputs.db != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Permission keys used in code exist in the domain matrix
        run: node scripts/check-permission-parity.mjs

      # F-ID-07 §5.1, §9.7-§9.8: every notify() event exists in the catalogue, and
      # every catalogue event has en + bn strings.
      - name: Notification catalogue parity
        run: node scripts/check-notification-catalog-parity.mjs

      # F-ID-09 §5.1, acceptance criterion 17: the SQL and TypeScript audit action
      # catalogues must name the exact same actions, or app.log_audit_event()'s
      # runtime guard and the viewer's filter UI silently drift apart.
      - name: Audit action catalogue parity (SQL <-> TypeScript)
        run: node scripts/check-audit-catalog-parity.mjs

      # D-56 (M0 wrap-up), the other half of `db`'s "RLS coverage" step: every
      # public table with a workspace_id column must be named in at least one
      # supabase/tests/*.sql file (ARCHITECTURE §9). Pure static analysis on
      # this job's own checkout, needing no database connection at all (see
      # coverage.sql's header comment for why this lives in a different job).
      - name: workspace_id table coverage (named in a supabase/tests/*.sql file)
        run: node scripts/check-coverage-test-files.mjs
      - run: node --test scripts/check-require-writable.test.mjs && node scripts/check-require-writable.mjs # D-300: tenant write paths call requireWritable

      # Generated-type freshness moved to the `db` job (DECISION-LOG D-55): types
      # are generated from THIS PR's migrations applied to the CI Postgres, not
      # from the live project, which only receives a PR's migrations after merge.

  build:
    name: build
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.outputs.app != 'false' || needs.changes.outputs.db != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Restore the Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.[jt]s?(x)') }}
          restore-keys: |
            next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build

      # TESTING §6: a school route over 250 kB first-load JS is a phone that stalls
      # on a 3G handset. The budget is checked, not hoped for.
      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          # `.next` is itself a dot-directory, and upload-artifact excludes any
          # path with a dot-prefixed segment by default, so with
          # include-hidden-files left at its default `false` the whole tree
          # matched zero files and no "build" artifact was ever created —
          # leaving lighthouse/e2e downloading a name that never existed.
          include-hidden-files: true
          path: |
            apps/web/.next/**
            !apps/web/.next/cache/**
          retention-days: 3

  # Runs on pull_request, never pull_request_target, so a fork PR cannot reach secrets.
  security:
    name: security
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.outputs.app != 'false' || needs.changes.outputs.db != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pinned image rather than the marketplace action, whose only published tag is
      # a moving `v1`. ERROR severity fails; the SARIF carries the rest.
      - name: Semgrep
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.177.0 \
            semgrep scan --metrics=off --error --sarif --output semgrep.sarif \
            --config p/typescript --config p/react --config p/nextjs \
            --config p/owasp-top-ten --config p/secrets --config .semgrep

      # Code scanning (and therefore SARIF upload) requires GitHub Advanced
      # Security, which is not enabled on this private repo. Upload the SARIF
      # as a plain artifact instead so findings stay reviewable; the Semgrep
      # step above still fails the job on blocking findings either way.
      - name: Upload Semgrep findings (code scanning)
        if: always() && hashFiles('semgrep.sarif') != '' && github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: semgrep.sarif

      - name: Upload Semgrep findings (artifact)
        if: always() && hashFiles('semgrep.sarif') != '' && github.event.repository.private == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 14

      - name: Dependency audit
        run: node scripts/audit-with-exceptions.mjs

      - name: Dependency review
        # Needs Dependency graph + Advanced Security, unavailable on private repos without GHAS.
        # `pnpm audit` above is the advisory gate meanwhile; this re-enables itself if the repo goes public.
        if: github.event_name == 'pull_request' && github.event.repository.private == false
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  e2e:
    name: e2e
    needs: [build, db, changes]
    # Skipped on drafts (the expensive jobs start when the PR is marked ready), on a
    # push to main (already ran on the PR that merged — CI.md §1: merge_group is never
    # partial, so it still runs e2e), and when this PR touched neither app nor db code.
    # `db` is allowed to be `skipped` (docs/app-only PRs never run it) but not
    # `failure`. `!cancelled()` is required here, not decorative: without a status
    # function in the expression GitHub silently ANDs an implicit `success()` across
    # every job in `needs`, so a `db` job that is legitimately `skipped` would still
    # skip e2e regardless of what the rest of this condition says
    # (actions/runner#491). `!cancelled()` removes that implicit gate so the explicit
    # `needs.db.result` checks below are the only thing that decides.
    if: |
      !cancelled() &&
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (needs.changes.outputs.app != 'false' || needs.changes.outputs.db != 'false') &&
      needs.build.result == 'success' &&
      (needs.db.result == 'success' || needs.db.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build
          path: apps/web/.next

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm --filter @acadigma/web exec playwright install --with-deps chromium

      # playwright.config.ts starts `next start` and waits for the port; both the
      # mobile-360 and desktop-1280 projects run.
      - name: Playwright
        run: pnpm test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30

      - name: Summary
        if: always()
        run: node scripts/e2e-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  lighthouse:
    name: lighthouse
    needs: [build, changes]
    # Same rules as e2e (see its comment): not on push to main, PR-drafts skipped,
    # merge_group runs, only when app or db changed, `!cancelled()` bypasses the
    # implicit needs-success gate so a legitimately-skipped upstream job can't take
    # this one down with it.
    if: |
      !cancelled() &&
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (needs.changes.outputs.app != 'false' || needs.changes.outputs.db != 'false') &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build
          path: apps/web/.next

      - name: Start the built app
        run: |
          pnpm --filter @acadigma/web exec next start --port 3000 &
          npx --yes wait-on@8 http://127.0.0.1:3000 --timeout 120000

      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            http://127.0.0.1:3000/
            http://127.0.0.1:3000/login
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

  changeset:
    name: changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a changeset for code changes
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/check-changeset.mjs

  docs-sync:
    name: docs-sync
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Verifies docs were not forgotten, not that they are good. Reviewers do the rest.
      - name: Docs accompany the change
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-docs-sync.mjs

  # Deliberately not a required check: it runs on always() and would block on an
  # unrelated failure (CI.md §3).
  report:
    name: report
    needs:
      [
        lint,
        typecheck,
        db,
        db-integration,
        unit,
        contracts,
        build,
        security,
        e2e,
        e2e-live,
        lighthouse,
        changeset,
        docs-sync,
      ]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip on fork PRs
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::notice::skipped - no secrets on fork PRs. Job summaries are still on the run page."

      - name: Comment the run summary, updating in place
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = "<!-- acadigma-ci-report -->"
            const results = ${{ toJSON(needs) }}
            const icon = (r) =>
              r === "success" ? "✅" : r === "skipped" ? "⏭️" : "❌"
            const rows = Object.entries(results)
              .map(([job, r]) => `| ${job} | ${icon(r.result)} ${r.result} |`)
              .join("\n")
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              marker,
              "### CI",
              "",
              "| Job | Result |",
              "| --- | --- |",
              rows,
              "",
              `[Full run, job summaries and artifacts](${run})`,
            ].join("\n")

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find((c) => c.body?.startsWith(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              })
            }
