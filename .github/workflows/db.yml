name: Database

# SQL style on PRs, and the production migration promotion on main.
# The pgTAP suite is the `db` job in ci.yml, because it is a merge gate (CI.md §3).
# Nobody applies a migration to production by hand — there is no exception
# (RELEASES §6.2).

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/db.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a migration that is being applied to production.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  sql-lint:
    name: sql-lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pg_format
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pgformatter

      # Reformats each file in memory and diffs, so the log shows exactly what to change.
      - name: Check SQL formatting
        # Style only — pg_format disagrees with hand-formatted DO blocks. The executable gate is CI / db.
        continue-on-error: true
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' file; do
            if ! diff -q "$file" <(pg_format "$file") >/dev/null 2>&1; then
              echo "::error file=$file::not pg_format-clean — run: pg_format --inplace $file"
              diff -u "$file" <(pg_format "$file") | head -40 || true
              status=1
            fi
          done < <(find supabase -name '*.sql' -print0)
          exit $status

      - name: Summary
        if: always()
        run: echo "### sql-lint" >> "$GITHUB_STEP_SUMMARY"

  push:
    name: push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      - name: Record the migration head before the push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          {
            echo "### Migration head before"
            echo '```'
            supabase migration list --linked || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked

      # D-65: an anonymous PostgREST call must still work after a deploy. The
      # pre-request hook once broke every anon request (so nobody could sign in)
      # and nothing in CI could see it: CI's Postgres has no PostgREST.
      - name: Smoke-test an anonymous API call against production
        env:
          SUPABASE_URL: https://kekfmibwjejdhxjkmezo.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_VbUqiEvQiuObUZMf5IGYOA_P_EiiyGy
        run: |
          set -euo pipefail
          sleep 5  # let PostgREST reload its config after `notify pgrst`
          status=$(curl -s -o /tmp/smoke.json -w '%{http_code}' -X POST             "$SUPABASE_URL/rest/v1/rpc/throttle_status"             -H "apikey: $SUPABASE_PUBLISHABLE_KEY"             -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY"             -H 'Content-Type: application/json'             -d '{"p_key":"ci-smoke:post-deploy"}')
          cat /tmp/smoke.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::anonymous API call failed with HTTP $status after the deploy — sign-in is likely broken"
            exit 1
          fi

      # The migration is already applied by this point, so what follows is an alert,
      # not a gate (RELEASES §6.2).
      - name: Record the migration head after the push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true
        run: |
          {
            echo "### Migration head after"
            echo '```'
            supabase migration list --linked || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
